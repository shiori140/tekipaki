<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <title>tekipaki</title>
    <link rel="stylesheet" href="base.css" />
    <style>
      html,
      body {
        background: transparent;
        overflow: hidden;
        cursor: default;
        user-select: none;
      }

      .card {
        position: absolute;
        inset: 4px;
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 0 14px;
        border-radius: 12px;
        background: var(--color, #555);
        color: var(--on-color, #fff);
        opacity: 0.92;
        transition: background-color 120ms ease, opacity 300ms ease, transform 300ms ease;
      }

      .card[data-priority="now"] { --color: var(--now); --on-color: var(--on-now); }
      .card[data-priority="today"] { --color: var(--today); --on-color: var(--on-today); }
      .card[data-priority="later"] { --color: var(--later); --on-color: var(--on-later); }
      .card[data-state="error"] { --color: #3a3a40; --on-color: #fff; }

      .card.bump { animation: bump 140ms ease; }
      @keyframes bump {
        50% { transform: scale(1.04); }
      }

      .card[data-state="commit"] { opacity: 0; transform: translateY(-6px) scale(0.98); }
      .card[data-state="cancel"] { opacity: 0; transition-duration: 150ms; }

      .steps {
        display: flex;
        gap: 4px;
        flex: none;
      }
      .steps span {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: currentColor;
        opacity: 0.3;
      }
      .steps span.on { opacity: 1; }

      .text {
        min-width: 0;
        display: flex;
        flex-direction: column;
        line-height: 1.25;
      }
      .label {
        font-size: 17px;
        font-weight: 700;
      }
      .preview {
        font-size: 11.5px;
        opacity: 0.85;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .preview:empty { display: none; }
    </style>
  </head>
  <body>
    <div class="card" id="card" data-priority="now">
      <div class="steps" aria-hidden="true"><span></span><span></span><span></span></div>
      <div class="text">
        <div class="label" id="label"></div>
        <div class="preview" id="preview"></div>
      </div>
    </div>
    <script type="module" src="overlay.js"></script>
  </body>
</html>
