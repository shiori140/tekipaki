<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <title>tekipaki</title>
    <link rel="stylesheet" href="base.css" />
    <style>
      body {
        background: var(--bg);
        padding: 16px;
      }

      header {
        display: flex;
        align-items: baseline;
        gap: 10px;
        margin-bottom: 14px;
      }
      h1 {
        margin: 0;
        font-size: 18px;
      }
      header p {
        margin: 0;
        color: var(--muted);
        font-size: 12px;
      }

      .columns {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 12px;
      }

      section h2 {
        margin: 0 0 8px;
        font-size: 13px;
        display: flex;
        align-items: center;
        gap: 6px;
      }
      section h2::before {
        content: "";
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: var(--color);
      }
      section[data-priority="now"] { --color: var(--now); }
      section[data-priority="today"] { --color: var(--today); }
      section[data-priority="later"] { --color: var(--later); }
      section h2 .count {
        color: var(--muted);
        font-weight: 400;
      }

      ul {
        list-style: none;
        margin: 0;
        padding: 0;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      li {
        background: var(--surface);
        border: 1px solid var(--border);
        border-left: 3px solid var(--color);
        border-radius: 8px;
        padding: 8px 10px;
      }
      .title {
        font-weight: 600;
        overflow-wrap: anywhere;
      }
      .memo {
        margin-top: 2px;
        color: var(--muted);
        font-size: 12px;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        display: -webkit-box;
        -webkit-line-clamp: 3;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }
      .meta {
        margin-top: 4px;
        color: var(--muted);
        font-size: 11px;
      }
      .empty {
        color: var(--muted);
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>tekipaki</h1>
      <p id="shortcut"></p>
    </header>
    <div class="columns" id="columns"></div>
    <script type="module" src="main.js"></script>
  </body>
</html>
